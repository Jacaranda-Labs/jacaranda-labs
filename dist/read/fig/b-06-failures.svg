6" y="367" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6670" style="">are you sure</text><line x1="40" y1="320" x2="720" y2="320" stroke="#dfe3e7" stroke-width="1"/><text x="40" y="344" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-size="12" fill="#5b6670" style="">Each one has a rule that holds it. The fifth is the subject of a different book in this series.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" font-kerning="normal"><rect width="760" height="440" fill="#fdfcf8"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#14171a"/></marker></defs><text x="40" y="42" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" fill="#5b6670" font-weight="600" letter-spacing=".12em" style="">OPERATORSHIP · FIGURE 1</text><text x="40" y="74" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-size="21" fill="#14171a" style="">Three moats, repriced one at a time</text><text x="40" y="98" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-size="12.5" fill="#5b6670" style="">Each wave commoditised the layer above the previous one. The moat moved down one level each time.</text><rect x="60" y="126" width="202" height="150" rx="3" fill="#f4f5f3" stroke="#dfe3e7" stroke-width="1"/><text x="74" y="148" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="8.5" fill="#7a1f1f" font-weight="600" letter-spacing=".12em" style="">1999–2008</text><text x="74" y="172" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-size="12.5" fill="#14171a" style="">software as a service</text><line x1="74" y1="184" x2="248" y2="184" stroke="#dfe3e7" stroke-width="1"/><text x="74" y="204" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="9" fill="#5b6670" font-weight="600" style="">priced at zero:</text><text x="74" y="222" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-size="13" fill="#14171a" style="">capital</text><text x="74" y="246" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="9" fill="#5b6670" font-weight="600" style="">what survived:</text><text x="74" y="264" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6670" style="">you still had to build it</text><rect x="274" y="126" width="202" height="150" rx="3" fill="#f4f5f3" stroke="#dfe3e7" stroke-width="1"/><text x="288" y="148" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="8.5" fill="#7a1f1f" font-weight="600" letter-spacing=".12em" style="">2009–2020</text><text x="288" y="172" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-size="12.5" fill="#14171a" style="">no-code and platforms</text><line x1="288" y1="184" x2="462" y2="184" stroke="#dfe3e7" stroke-width="1"/><text x="288" y="204" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="9" fill="#5b6670" font-weight="600" style="">priced at zero:</text><text x="288" y="222" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-size="13" fill="#14171a" style="">product shape</text><text x="288" y="246" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="9" fill="#5b6670" font-weight="600" style="">what survived:</text><text x="288" y="264" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6670" style="">you had to beat the template</text><rect x="488" y="126" width="202" height="150" rx="3" fill="#f4f5f3" stroke="#dfe3e7" stroke-width="1"/><text x="502" y="148" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="8.5" fill="#7a1f1f" font-weight="600" letter-spacing=".12em" style="">2021–2026</text><text x="502" y="172" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-size="12.5" fill="#14171a" style="">capability as a utility</text><line x1="502" y1="184" x2="676" y2="184" stroke="#dfe3e7" stroke-width="1"/><text x="502" y="204" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="9" fill="#5b6670" font-weight="600" style="">priced at zero:</text><text x="502" y="222" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-size="13" fill="#14171a" style="">thought</text><text x="502" y="246" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="9" fill="#5b6670" font-weight="600" style="">what survived:</text><text x="502" y="264" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6670" style="">you had to know what to think</text><path d="M262 200 L274 200" stroke="#5b6670" stroke-width="1.2" fill="none" marker-end="url(#ah)"/><path d="M476 200 L488 200" stroke="#5b6670" stroke-width="1.2" fill="none" marker-end="url(#ah)"/><path d="M210 282 L210 316" stroke="#7a1f1f" stroke-width="1.4" fill="none" marker-end="url(#ah)"/><text x="224" y="306" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#7a1f1f" font-weight="600" style="">what is underneath thought is consequence</text><rect x="60" y="320" width="640" height="54" rx="3" fill="#fbf3f2" stroke="#7a1f1f" stroke-width="1.2"/><text x="78" y="344" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-size="14" fill="#14171a" style="">Nothing sits under consequence.</text><text x="78" y="362" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6670" style="">The last wave that can reprice the fundamentals — which is why the name has to change now.</text><text x="60" y="404" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-size="12.5" fill="#14171a" style="font-style:italic">The same gift every time: your advantage, handed to everybody.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" font-kerning="normal"><rect width="760" height="380" fill="#fdfcf8"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#14171a"/></marker></defs><text x="40" y="42" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" fill="#5b6670" font-weight="600" letter-spacing=".12em" style="">THE POINT OF FAILURE · FIGURE 5</text><text x="40" y="74" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-size="20" fill="#14171a" style="">Anxiety written down becomes a list; anxiety held becomes a day</text><rect x="40" y="104" width="330" height="210" rx="3" fill="#f4f5f3" stroke="#dfe3e7" stroke-width="1"/><text x="56" y="128" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" fill="#7a1f1f" font-weight="600" letter-spacing=".12em" style="">HELD</text><circle cx="205" cy="218" r="62" fill="none" stroke="#7a1f1f" stroke-width="1.2"/><path d="M258.32 187.0 A62 62 0 0 1 236.0 271.32" fill="none" stroke="#7a1f1f" stroke-width="2" marker-end="url(#ah)"/><text x="116.66540881398726" y="179.0" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#5b6670" font-weight="600" text-anchor="middle" style="">the fear</text><text x="293.33459118601274" y="179.0" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#5b6670" font-weight="600" text-anchor="middle" style="">no action</text><text x="205.0" y="296.0" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#5b6670" font-weight="600" text-anchor="middle" style="">the fear, again</text><text x="56" y="300" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" fill="#5b6670" style="">no conclusion · a constant tax on everything else</text><rect x="390" y="104" width="330" height="210" rx="3" fill="#fbf8f2" stroke="#dfe3e7" stroke-width="1"/><text x="406" y="128" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" fill="#5b6670" font-weight="600" letter-spacing=".12em" style="">WRITTEN · 20 MINUTES</text><rect x="406" y="145" width="298" height="26" rx="2" fill="#fff" stroke="#dfe3e7" stroke-width="1"/><text x="418" y="162" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#14171a" style="">the fear — named, in one line</text><path d="M682 149 l3.2 3.6 l7.2 -8.0" fill="none" stroke="#2f6b3a" stroke-width="1.7600000000000002" stroke-linecap="round" stroke-linejoin="round"/><rect x="406" y="179" width="298" height="26" rx="2" fill="#fff" stroke="#dfe3e7" stroke-width="1"/><text x="418" y="196" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#14171a" style="">the worst case — survivable?</text><path d="M682 183 l3.2 3.6 l7.2 -8.0" fill="none" stroke="#2f6b3a" stroke-width="1.7600000000000002" stroke-linecap="round" stroke-linejoin="round"/><rect x="406" y="213" width="298" height="26" rx="2" fill="#fff" stroke="#dfe3e7" stroke-width="1"/><text x="418" y="230" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#14171a" style="">the next physical action — one</text><path d="M682 217 l3.2 3.6 l7.2 -8.0" fill="none" stroke="#2f6b3a" stroke-width="1.7600000000000002" stroke-linecap="round" stroke-linejoin="round"/><rect x="406" y="247" width="298" height="26" rx="2" fill="#fff" stroke="#dfe3e7" stroke-width="1"/><text x="418" y="264" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#14171a" style="">then: closed until the next window</text><path d="M682 251 l3.2 3.6 l7.2 -8.0" fill="none" stroke="#2f6b3a" stroke-width="1.7600000000000002" stroke-linecap="round" stroke-linejoin="round"/><text x="406" y="300" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" fill="#5b6670" style="font-style:italic">a list has an end · a task is smaller than a threat</text><line x1="40" y1="336" x2="720" y2="336" stroke="#dfe3e7" stroke-width="1"/><text x="40" y="360" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-size="12" fill="#5b6670" style="">Twenty minutes with a pen, then the window is closed. Not because the worry is solved, but because the reading is finished.</text></svg>
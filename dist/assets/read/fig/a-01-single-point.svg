<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" font-kerning="normal"><rect width="760" height="470" fill="#fdfcf8"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#14171a"/></marker></defs><text x="40" y="42" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" fill="#5b6670" font-weight="600" letter-spacing=".12em" style="">THE POINT OF FAILURE · FIGURE 1</text><text x="40" y="74" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-size="21" fill="#14171a" style="">Every component has a failover except one</text><text x="40" y="98" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-size="12.5" fill="#5b6670" style="">The estate is designed so that any single part can be absent for a while. One part cannot.</text><rect x="40" y="130" width="400" height="34" rx="3" fill="#f4f5f3" stroke="#dfe3e7" stroke-width="1"/><text x="54" y="152" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-size="13.5" fill="#14171a" style="">Publishing rail</text><text x="196" y="152" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6670" style="">retries · says so when it fails</text><path d="M414 142 l3.6 4.05 l8.1 -9.0" fill="none" stroke="#2f6b3a" stroke-width="1.9800000000000002" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="170" width="400" height="34" rx="3" fill="#f4f5f3" stroke="#dfe3e7" stroke-width="1"/><text x="54" y="192" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-size="13.5" fill="#14171a" style="">Post bank</text><text x="196" y="192" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6670" style="">refills before it empties</text><path d="M414 182 l3.6 4.05 l8.1 -9.0" fill="none" stroke="#2f6b3a" stroke-width="1.9800000000000002" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="210" width="400" height="34" rx="3" fill="#f4f5f3" stroke="#dfe3e7" stroke-width="1"/><text x="54" y="232" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-size="13.5" fill="#14171a" style="">Deploy</text><text x="196" y="232" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6670" style="">rebuilds · verifies the origin</text><path d="M414 222 l3.6 4.05 l8.1 -9.0" fill="none" stroke="#2f6b3a" stroke-width="1.9800000000000002" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="250" width="400" height="34" rx="3" fill="#f4f5f3" stroke="#dfe3e7" stroke-width="1"/><text x="54" y="272" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-size="13.5" fill="#14171a" style="">Checkouts</text><text x="196" y="272" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6670" style="">take money without anyone awake</text><path d="M414 262 l3.6 4.05 l8.1 -9.0" fill="none" stroke="#2f6b3a" stroke-width="1.9800000000000002" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="290" width="400" height="34" rx="3" fill="#f4f5f3" stroke="#dfe3e7" stroke-width="1"/><text x="54" y="312" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-size="13.5" fill="#14171a" style="">Front doors</text><text x="196" y="312" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6670" style="">checked hourly from outside</text><path d="M414 302 l3.6 4.05 l8.1 -9.0" fill="none" stroke="#2f6b3a" stroke-width="1.9800000000000002" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="330" width="400" height="34" rx="3" fill="#f4f5f3" stroke="#dfe3e7" stroke-width="1"/><text x="54" y="352" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-size="13.5" fill="#14171a" style="">Credentials</text><text x="196" y="352" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6670" style="">expire loudly, not quietly</text><path d="M414 342 l3.6 4.05 l8.1 -9.0" fill="none" stroke="#2f6b3a" stroke-width="1.9800000000000002" stroke-linecap="round" stroke-linejoin="round"/><rect x="470" y="130" width="250" height="232" rx="4" fill="#fbf3f2" stroke="#7a1f1f" stroke-width="1.5"/><text x="490" y="158" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" fill="#7a1f1f" font-weight="600" letter-spacing=".12em" style="">NO REPLICA</text><text x="490" y="196" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-size="19" fill="#14171a" style="">The operator</text><text x="490" y="220" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6670" style="">One nervous system.</text><text x="490" y="236" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6670" style="">One sleep pattern.</text><text x="490" y="252" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6670" style="">One capacity to decide</text><text x="490" y="268" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6670" style="">at four in the afternoon.</text><path d="M490 292 l9.9 9.9 M499.9 292 l-9.9 9.9" fill="none" stroke="#7a1f1f" stroke-width="2.4200000000000004" stroke-linecap="round"/><text x="512" y="302" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#7a1f1f" font-weight="600" style="">no warm standby</text><text x="490" y="330" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-size="12.5" fill="#14171a" style="font-style:italic">Everything rests on it.</text><line x1="40" y1="392" x2="720" y2="392" stroke="#14171a" stroke-width="1"/><text x="40" y="418" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-size="12.5" fill="#14171a" style="">The operator therefore gets what every other component gets:</text><rect x="40" y="430" width="158" height="26" rx="13" fill="#f4f5f3" stroke="#dfe3e7" stroke-width="1"/><text x="119" y="447" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#14171a" font-weight="600" text-anchor="middle" style="">written down</text><rect x="212" y="430" width="158" height="26" rx="13" fill="#f4f5f3" stroke="#dfe3e7" stroke-width="1"/><text x="291" y="447" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#14171a" font-weight="600" text-anchor="middle" style="">checked</text><rect x="384" y="430" width="158" height="26" rx="13" fill="#f4f5f3" stroke="#dfe3e7" stroke-width="1"/><text x="463" y="447" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#14171a" font-weight="600" text-anchor="middle" style="">given limits</text><rect x="556" y="430" width="158" height="26" rx="13" fill="#f4f5f3" stroke="#dfe3e7" stroke-width="1"/><text x="635" y="447" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#14171a" font-weight="600" text-anchor="middle" style="">monitored</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" font-kerning="normal"><rect width="760" height="400" fill="#fdfcf8"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#14171a"/></marker></defs><text x="40" y="42" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" fill="#5b6670" font-weight="600" letter-spacing=".12em" style="">OPERATORSHIP · FIGURE 2</text><text x="40" y="74" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-size="21" fill="#14171a" style="">Two curves that crossed</text><text x="40" y="98" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-size="12.5" fill="#5b6670" style="">The cost of making the thing fell to nothing. The cost of being believed did not move — and then became the whole job.</text><path d="M90 130 L90 330 L670 330" fill="none" stroke="#14171a" stroke-width="1.2"/><text x="90" y="118" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" fill="#5b6670" font-weight="600" letter-spacing=".12em" style="">COST PER UNIT</text><text x="98" y="146" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" fill="#5b6670" style="">high</text><text x="98" y="324" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" fill="#5b6670" style="">low</text><line x1="124.8" y1="330" x2="124.8" y2="335" stroke="#5b6670" stroke-width="1"/><text x="124.8" y="350" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" fill="#5b6670" text-anchor="middle" style="">2000</text><line x1="264.0" y1="330" x2="264.0" y2="335" stroke="#5b6670" stroke-width="1"/><text x="264.0" y="350" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" fill="#5b6670" text-anchor="middle" style="">2008</text><line x1="426.4" y1="330" x2="426.4" y2="335" stroke="#5b6670" stroke-width="1"/><text x="426.4" y="350" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" fill="#5b6670" text-anchor="middle" style="">2016</text><line x1="646.8" y1="330" x2="646.8" y2="335" stroke="#5b6670" stroke-width="1"/><text x="646.8" y="350" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" fill="#5b6670" text-anchor="middle" style="">2026</text><path d="M108 160 C 270 170, 350 250, 420 290 S 570 316, 660 320" fill="none" stroke="#14171a" stroke-width="2"/><text x="198" y="276" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#14171a" font-weight="600" style="">what a launch costs</text><path d="M108 308 C 290 306, 390 280, 510 226 S 610 170, 660 156" fill="none" stroke="#7a1f1f" stroke-width="2"/><text x="420" y="164" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#7a1f1f" font-weight="600" style="">what being believed costs</text><circle cx="355" cy="247" r="4" fill="#7a1f1f"/><text x="368" y="242" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" fill="#7a1f1f" font-weight="600" style="">the crossover</text><line x1="40" y1="352" x2="720" y2="352" stroke="#dfe3e7" stroke-width="1"/><text x="40" y="376" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-size="12" fill="#5b6670" style="">After the crossover, capability is a subscription and judgement is the scarce input. The word for an operator is not a courtesy; it is a price.</text></svg>
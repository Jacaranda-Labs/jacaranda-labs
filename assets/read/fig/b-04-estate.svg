uence</text><text x="56" y="268" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#14171a" style="">· the record of what was said</text><text x="56" y="292" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#14171a" style="">· the operator's calibration</text><text x="56" y="306" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" fill="#5b6670" font-weight="600" style="">fixed cost, paid once</text><rect x="400" y="122" width="250" height="42" rx="3" fill="#fff" stroke="#dfe3e7" stroke-width="1"/><text x="414" y="148" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-size="11.5" fill="#14171a" style="">venture 1 — a hypothesis</text><text x="636" y="148" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="9" fill="#5b6670" font-weight="600" text-anchor="end" style="">killable</text><rect x="400" y="172" width="250" height="42" rx="3" fill="#fff" stroke="#dfe3e7" stroke-width="1"/><text x="414" y="198" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-size="11.5" fill="#14171a" style="">venture 2 — a hypothesis</text><text x="636" y="198" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="9" fill="#5b6670" font-weight="600" text-anchor="end" style="">killable</text><rect x="400" y="222" width="250" height="42" rx="3" fill="#fff" stroke="#dfe3e7" stroke-width="1"/><text x="414" y="248" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-size="11.5" fill="#14171a" style="">venture 3 — a hypothesis</text><text x="636" y="248" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="9" fill="#5b6670" font-weight="600" text-anchor="end" style="">killable</text><rect x="400" y="272" width="
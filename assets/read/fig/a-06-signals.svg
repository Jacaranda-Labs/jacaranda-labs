<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" font-kerning="normal"><rect width="760" height="360" fill="#fdfcf8"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#14171a"/></marker></defs><text x="40" y="42" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" fill="#5b6670" font-weight="600" letter-spacing=".12em" style="">THE POINT OF FAILURE · FIGURE 6</text><text x="40" y="74" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-size="21" fill="#14171a" style="">Five signals that arrive before the bad day</text><text x="40" y="98" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-size="12.5" fill="#5b6670" style="">Feelings lag. These four are visible in artefacts you already produce; the fifth is the least subtle.</text><circle cx="56" cy="142" r="13" fill="#f4f5f3" stroke="#dfe3e7"/><text x="56" y="147" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#14171a" font-weight="600" text-anchor="middle" style="">1</text><text x="84" y="146" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-size="14" fill="#14171a" style="">The non-work life shrinks</text><text x="320" y="146" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6670" style="">walk · conversation · Saturdays</text><text x="586" y="146" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" fill="#5b6670" font-weight="600" style="">calendar</text><line x1="40" y1="162" x2="720" y2="162" stroke="#dfe3e7" stroke-width="1"/><circle cx="56" cy="186" r="13" fill="#f4f5f3" stroke="#dfe3e7"/><text x="56" y="191" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" 
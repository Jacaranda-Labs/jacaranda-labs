,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6670" style="">curt, or over-explained</text><text x="586" y="278" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" fill="#5b6670" font-weight="600" style="">your sent folder</text><line x1="40" y1="294" x2="720" y2="294" stroke="#dfe3e7" stroke-width="1"/><circle cx="56" cy="318" r="13" fill="#fbf3f2" stroke="#7a1f1f"/><text x="56" y="323" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#7a1f1f" font-weight="600" text-anchor="middle" style="">5</text><text x="84" y="322" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-size="14" fill="#14171a" style="">Sleep goes</text><text x="320" y="322" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6670" style="">the last to show, the least subtle</text><text x="586" y="322" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" fill="#5b6670" font-weight="600" style="">the week</text><line x1="40" y1="338" x2="720" y2="338" stroke="#dfe3e7" stroke-width="1"/><text x="40" y="350" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-size="12" fill="#14171a" style="font-style:italic">Three of five showing: treat the week as if it contained a bad day, and take the protocol early.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" font-kerning="normal"><rect width="760" height="400" fill="#fdfcf8"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#14171a"/></marker></defs><text x="40" y="42" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" fill="#5b6670" font-weight="600" letter-spacing=".12em" style="">THE POINT OF FAILURE · FIGURE 4</text><text x="40" y="74" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-size="20" fill="#14171a" style="">The bad day: three steps, in order, and none of them is rescuing the day</text><rect x="40" y="108" width="216" height="216" rx="3" fill="#f4f5f3" stroke="#dfe3e7" stroke-width="1"/><rect x="40" y="108" width="216" height="4" fill="#14171a"/><text x="56" y="138" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="8.5" fill="#7a1f1f" font-weight="600" letter-spacing=".12em" style="">STEP ONE</text><text x="56" y="162" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6670" font-weight="600" style="">2 minutes</text><text x="56" y="190" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-size="16" fill="#14171a" style="">Make it safe</text><line x1="56" y1="202" x2="240" y2="202" stroke="#dfe3e7" stroke-width="1"/><text x="56" y="224" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6670" style="">Run the estate screen once.</text><text x="56" y="241" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6670" style="">If the one thing is under three minutes, do it.</text><text x="56" y="258" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6670" style="">If not: nothing today.</text><path d="M260 216 L268 216" stroke="#5b6670" stroke-width="1.2" fill="none" marker-end="url(#ah)"/><rect x="272" y="108" width="216" height="216" rx="3" fill="#f4f5f3" stroke="#dfe3e7" stroke-width="1"/><rect x="272" y="108" width="216" height="4" fill="#14171a"/><text x="288" y="138" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="8.5" fill="#7a1f1f" font-weight="600" letter-spacing=".12em" style="">STEP TWO</text><text x="288" y="162" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6670" font-weight="600" style="">10 minutes</text><text x="288" y="190" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-size="16" fill="#14171a" style="">Shrink the day</text><line x1="288" y1="202" x2="472" y2="202" stroke="#dfe3e7" stroke-width="1"/><text x="288" y="224" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6670" style="">Cancel what can be cancelled.</text><text x="288" y="241" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6670" style="">One outcome becomes none — or becomes</text><text x="288" y="258" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6670" style="">eat, walk, sleep at a reasonable hour.</text><path d="M492 216 L500 216" stroke="#5b6670" stroke-width="1.2" fill="none" marker-end="url(#ah)"/><rect x="504" y="108" width="216" height="216" rx="3" fill="#f4f5f3" stroke="#dfe3e7" stroke-width="1"/><rect x="504" y="108" width="216" height="4" fill="#14171a"/><text x="520" y="138" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="8.5" fill="#7a1f1f" font-weight="600" letter-spacing=".12em" style="">STEP THREE</text><text x="520" y="162" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6670" font-weight="600" style="">the rest of it</text><text x="520" y="190" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-size="16" fill="#14171a" style="">Leave it alone</text><line x1="520" y1="202" x2="704" y2="202" stroke="#dfe3e7" stroke-width="1"/><text x="520" y="224" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6670" style="">No catching up later in the same day.</text><text x="520" y="241" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6670" style="">The shutdown still happens,</text><text x="520" y="258" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6670" style="">even if the day contained nothing.</text><line x1="40" y1="348" x2="720" y2="348" stroke="#14171a" stroke-width="1"/><text x="40" y="374" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-size="12.5" fill="#14171a" style="font-style:italic">A day that is closed properly costs one day. A day that is repaid costs four.</text></svg>
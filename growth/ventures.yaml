      {why}

      US$15 a month, no commission on your sales. See the shop math here:
      https://tapstall.tapstall.workers.dev

      Reply "stop" and I will remove you.

      Courage
      Jacaranda Labs · jacaranda-labs.pages.dev

  attestos:
    name: AttestOS
    reply_phrase: "BOTS"
    url: https://attestos-edge.proofhand.workers.dev
    sells: "proof that a request comes from a real user and not a script — passkeys, private access tokens, proof of work"
    price: "free scanner; paid plans"

# Who buys each venture, what to say, and where to look.
#
# This is the part that makes the lead hunter general: the machinery is the same for all seven, and
# only this file changes. A profile is an ICP (who, where, which words mean "in market"), an offer
# with a real price, and a first-touch line short enough to read on a phone.
#
# Rules this file is written under:
#   * every venture sells something a stranger can buy today, at a published price
#   * the first line names the venture and what it does — no coy "quick question"
#   * the system sends: three touches, 48h then 72h, then it stops for good (growth/outreach.py)
#   * the first touch carries no link; the reply phrase is what earns the freebie
#   * a reply stops every channel for that lead, immediately
#   * a lead only enters the list if the contact detail is published by the organisation itself

defaults:
  sender: "Courage Garikai <couragegarikai@atomicmail.io>"
  country_hints: [ZW, ZA, ZM, KE, NG, BW, NA, MW, TZ, UG]
  contact_paths: [/contact, /contact-us, /contactus, /about, /about-us, /get-in-touch, /team]
  min_score: 45
  max_pages_per_site: 4
  delay_seconds: 2.0
  robots: true
  do_not_contact: growth/dnc.txt

ventures:
  deskos:
    name: DeskOS
    reply_phrase: "TENDERS"
    url: https://desk.tapstall.com
    sells: "a tender desk: open public tenders from 13 sources read every morning, soonest deadline first"
    price: "free tier; Pro for the weekly pack"
    who: "small firms that bid for public contracts — construction, supplies, consulting, IT, cleaning, security"
    signals:
      strong: [tender, tenders, procurement, bid, bids, rfq, rfp, eoi, "request for proposal", praz, ppa]
      weak: [supplier, contractor, "registered supplier", sidama, "vendor number"]
    queries:
      - 'site:*.co.zw "registered supplier" tender OR procurement contact'
      - '"supplier registration" "tender" Harare Zimbabwe contact email'
      - '"bid" "tender" "company profile" Zambia OR Zimbabwe procurement contact'
    first_touch: |
      Subject: {company} and the tenders you have not seen yet

      Hello,

      I run DeskOS. It reads 13 public tender sources — World Bank, UN agencies, the EBRD, EU TED and
      national portals — every morning and puts them on one page, soonest deadline first, each linked
      to the original notice.

      {why}

      The free tier covers the daily list. If it is useful, Pro adds the weekly read: what closed,
      what is closing, and what your firm is eligible for. No account needed to look:
      https://desk.tapstall.com

      If this is not relevant, reply "stop" and I will remove you.

      Courage
      Jacaranda Labs · jacaranda-labs.pages.dev

  tightbucket:
    name: TightBucket
    reply_phrase: "AUDIT"
    url: https://tightbucket.whop.site
    sells: "a leak audit for online shops: what the storefront gives away, priced in lost orders"
    price: "audit from US$450"
    who: "Shopify and WooCommerce shops doing real volume, especially in ZW/ZA/KE"
    signals:
      strong: [shopify, woocommerce, "online store", checkout, cart, "free shipping"]
      weak: [store, shop, boutique, "add to cart", delivery]
    queries:
      - '"shopify" OR "woocommerce" store Zimbabwe OR Zambia "add to cart" contact'
      - '"online shop" Harare OR Lusaka OR Nairobi "delivery" contact email'
    first_touch: |
      Subject: three things {domain} gives away at checkout

      Hello,

      I run TightBucket, which audits online shops for the leaks that cost orders rather than views —
      checkout friction, delivery promises that do not survive contact with a courier, and the
      discount structure that trains buyers to wait.

      {why}

      The audit is US$450 and you get the findings, the screenshots and the fix order. If the first
      three paragraphs are not worth it, do not pay: https://tightbucket.whop.site

      Reply "stop" and I will remove you.

      Courage
      Jacaranda Labs · jacaranda-labs.pages.dev

  tapstall:
    name: Tapstall
    reply_phrase: "SHOP"
    url: https://tapstall.tapstall.workers.dev
    sells: "a WhatsApp shop: one link, orders in a dashboard you own, exact-amount payment matching"
    price: "from US$15/month"
    who: "social sellers and small shops in ZW/ZA/KE taking orders in DMs"
    signals:
      strong: ["whatsapp order", "dm to order", "inbox", "price list", "order via whatsapp"]
      weak: [menu, catalogue, catalog, "we deliver", "place your order"]
    queries:
      - '"order via WhatsApp" Zimbabwe OR Zambia shop'
      - '"DM to order" OR "WhatsApp us to order" Harare OR Bulawayo OR Lusaka'
    first_touch: |
      Subject: {company} — orders in one place instead of a chat

      Hello,

      I run Tapstall. It gives a seller one shop link: the customer orders and pays an exact amount to

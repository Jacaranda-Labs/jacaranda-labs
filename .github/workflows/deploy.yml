# Build and check.
#
# The Cloudflare Pages deploy and the GitHub Pages mirror were removed on
# 2026-11-22. Until then this workflow built dist with build.py and published it
# to the Pages project `jacaranda-labs` and to jacaranda-labs.github.io, which
# meant every push to main republished the pre-rename "Jacaranda Labs" site over
# production - including over any redirect placed on that host.
#
# build.py is not the generator that produced the live v2 estate: the v2 pages
# come from a different toolchain, and the studio's own site is served by the
# `estate` worker and the `coldcode-estate` Pages project. So this workflow now
# builds and validates only. Nothing is published from here.
#
# If you want CI to publish again, point it at the v2 generator first, then add
# a deploy step targeting `coldcode-estate` - not `jacaranda-labs`.

name: build and check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and check
        run: python3 build.py --check

      - name: Keep the build as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
